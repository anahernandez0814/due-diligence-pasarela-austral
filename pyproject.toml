[project]
name = "due-diligence-pasarela-austral"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "claude-agent-sdk>=0.2.168,<0.3",
    "mcp>=2.3,<3",
    "pydantic>=2",
    "python-dotenv>=1.2,<2",
    "streamlit>=1.66,<2",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["due_diligence", "servidor_mcp"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".specify"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["src", ".claude/hooks", "plugins"]
# #13: las carpetas del plugin van primero, porque `.claude/hooks/guarda_datos.py` es solo el
# archivo de compatibilidad y `import guarda_datos` debe llegar a la guarda del plugin.
pythonpath = [
    "plugins/guardas-y-revision/hooks",
    "plugins/guardas-y-revision/scripts",
    ".claude/hooks",
]
python_files = ["test_*.py"]
# #12 (R4): los casos (a)–(g) de punta a punta llaman al modelo real; `uv run pytest` los excluye
# y se piden con `uv run pytest -m e2e -rs` (el último `-m` sustituye a este).
addopts = ["--import-mode=importlib", "-m", "not e2e"]
markers = [
    "e2e: casos (a)–(g) de punta a punta con el modelo real; consume API (uv run pytest -m e2e -rs)",
]
